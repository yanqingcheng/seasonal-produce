<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Year-wheel</title>
  <meta name="description" content="Spin the year-wheel to see what's growing each month." />
  <meta property="og:title" content="Year-wheel" />
  <meta property="og:description" content="Spin the year-wheel to see what's growing each month." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="og.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="og.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="sprite"></div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark" id="brand-mark"></span>
      <div>
        <h1 id="title"></h1>
        <p id="tagline"></p>
      </div>
    </div>
    <button type="button" id="today-btn" class="chunky-btn" hidden></button>
  </header>

  <main class="stage">
    <section class="wheel-wrap" aria-label="Year-wheel">
      <svg id="wheel" viewBox="-520 -780 1040 1300" role="group"></svg>
      <nav class="month-rail" id="month-rail"></nav>
      <p class="hint" id="hint"></p>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>

  <footer class="foot">
    <p id="attribution"></p>
  </footer>

  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>

  <script type="module" src="exhibit.js"></script>
</body>
</html>
